<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ Chatbot</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2ff;font-family:Arial,sans-serif;color:#172033}
main{max-width:720px;margin:30px auto;padding:16px}.chat{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #17203318}
header{background:#4f46e5;color:white;padding:22px}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;opacity:.9}
#messages{height:390px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 14px;border-radius:14px;max-width:88%;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#f0f2f8;align-self:flex-start}.user{background:#4f46e5;color:white;align-self:flex-end}
form{display:flex;gap:8px;padding:14px;border-top:1px solid #e4e7ef}
input{flex:1;min-width:0;padding:12px;border:1px solid #cbd1e1;border-radius:10px;font:inherit}
button{border:0;background:#4f46e5;color:white;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
.suggestions{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}.suggestions button{background:#e8eaff;color:#3730a3;font-size:12px;padding:8px}
@media(max-width:600px){main{margin:0;padding:8px}#messages{height:55vh}}
</style>
</head>
<body><main><section class="chat">
<header><h1>FAQ Chatbot</h1><p>Ask a question about accounts, orders, support, or refunds.</p></header>
<div id="messages" aria-live="polite"><div class="msg bot">Hi! I'm the FAQ assistant. What would you like to know?</div></div>
<div class="suggestions">
<button type="button" onclick="suggest('How do I reset my password?')">Reset password</button>
<button type="button" onclick="suggest('What are your working hours?')">Working hours</button>
<button type="button" onclick="suggest('Where can I find my order status?')">Order status</button>
</div>
<form id="chat-form"><input id="question" maxlength="500" placeholder="Type your question..." autocomplete="off" required><button type="submit">Send</button></form>
</section></main>
<script>
const messages=document.getElementById('messages');
function addMessage(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;}
async function sendQuestion(text){
  if(!text.trim())return;
  addMessage(text,'user');
  const input=document.getElementById('question');input.value='';
  try{
    const res=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});
    if(!res.ok)throw new Error('Request failed');
    const data=await res.json();addMessage(data.answer,'bot');
  }catch(e){addMessage('Sorry, something went wrong. Please try again.','bot');}
}
document.getElementById('chat-form').addEventListener('submit',e=>{e.preventDefault();sendQuestion(inputValue());});
function inputValue(){return document.getElementById('question').value;}
function suggest(text){document.getElementById('question').value=text;sendQuestion(text);}
</script></body></html>
